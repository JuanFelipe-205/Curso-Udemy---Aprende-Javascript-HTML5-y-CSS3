<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Switch</title>
    <link rel='stylesheet' href='main.css'>

    <script>
        var nombre = "Tango";
        var mensaje2;
        var mensaje = ", te querio mucho";

        switch(nombre) {

            case "Tango" : 
                mensaje2 = "Wando";
                break;

            case "Kira" : 
                mensaje2 = "Maria";
                break;
                
            case "Sofia" : 
                mensaje2 = "Sofia";
                break;

            case "Felipe" : 
                mensaje2 ="Felipe";
                break;

            default:
                mensaje2 = "Sapo";
                mensaje = ", bien o que ?"
                break;
        }

        document.write("Hola ", nombre, mensaje2, mensaje)

    </script>

</head>

</body>
</html>

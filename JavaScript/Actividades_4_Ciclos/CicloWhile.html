<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Cilo While</title>
    <link rel='stylesheet' href='main.css'>
    <script>
        var i = 1;
        while(i <= 10){
            document.write(i + "<br>");
            i ++;
        }
        document.write("Salida: ", i , "<br>");

    </script>
</head>
<body>
    
</body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Bom | Navigator</title>
    <link rel='stylesheet' href='main.css'>
    <script>
        document.write("Galletas activas: " + navigator.cookieEnabled + "<br>");
        document.write("App Name: " + navigator.appName + "<br>");
        document.write("App code name: " + navigator.appCodeName + "<br>");
        document.write("Moto navegador: " + navigator.product + "<br>");
        document.write("Version del navegador: " + navigator.appVersion + "<br>");
        document.write("User agent: " + navigator.userAgent + "<br>");
        document.write("Plataforma: " + navigator.platform + "<br>");
        document.write("Lenguaje: " + navigator.language + "<br>");
        document.write("En linea: " + navigator.onLine + "<br>");
        document.write("Java activo: " + navigator.javaEnabled + "<br>");

    </script>
</head>

</body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Condicional</title>
    <link rel='stylesheet' href='main.css'>

    <script>
        var valor = window.prompt("¿ Cuantos años tienes ?");

        if(valor >= 1 && valor <= 17){
            window.alert("Eres un niño");

        } else if (valor >= 18 && valor <= 28) {
            window.alert("Eres un jove");

        } else if (valor >= 29 && valor <= 60) {
            window.alert("Eres un señor");

            
        } else if (valor >= 61 && valor <= 99) {
            window.alert("Eres una persona mayor");

        } else {
            window.alert("En serio tienes esa edad ????");

        }

    </script>

</head>

</body>
</html>

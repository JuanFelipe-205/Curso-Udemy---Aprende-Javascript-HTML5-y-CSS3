        var hoy = new Date();

        var anio = hoy.getFullYear();
        var minuto = hoy.getMinutes();
        var segundos = hoy.getSeconds();
        var milSegundos = hoy.getMilliseconds();
        
        document.write("Fecha actual: ", hoy, "<br>");
        document.write("Fecha actual concatenada: ", dia, "/", diaMes,"/" ,anio);

    </script>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='main.css'>

    <script>

        // Ejercicio de operadores comparacion
        console.log("Operadores comparacion:");

        console.log("10 == 10", 10 == 10);
        console.log("10 == '10'", 10 == '10');
        console.log("10 <= 10", 10 <= 10);
        console.log("10 === 10", 10 === 10);
        console.log("10 === '10'", 10 === '10');
        console.log("10 !== '10'", 10 !== '10');

        // Ejercicio de operadores logicos
        console.log("Operadores logicos:");
        var yes = true;
        var no = false;

        console.log(yes && no);
        console.log(yes && yes);
        console.log(yes || no);

        // Ejercicio de operadores unarios
        console.log("Operadores unarios:");
        
        var a = 10;
        a += 10;
        console.log("a += 10 : ", a);

        a -= 10;
        console.log("a -= 10 : ", a);

        a *= 3;
        console.log("a *= 3 : ", a);

    </script>

</head>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Bom | Location</title>
    <link rel='stylesheet' href='main.css'>
    <script>
        document.write("URL: " + window.location.href + "<br>");
        document.write("HostName: " + location.hostname + "<br>");
        document.write("Ruta: " + location.pathname + "<br>");
        document.write("Protocolo: " + location.protocol + "<br>");
        document.write("Puerto: " + location.port + "<br>");
        
        function enlace() {
            location.assign("https://www.youtube.com/watch?v=TE1qzHz7goU&list=RD7eqzpjUu1_c&index=6");
        }

    </script>
</head>
<body>
    <input type = "button" value="AZ medellifiacion" onclick="enlace()" />
</body>
</html>

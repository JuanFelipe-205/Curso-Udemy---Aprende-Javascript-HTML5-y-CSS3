<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ciclos For</title>
    <link rel='stylesheet' href='main.css'>

    <script>

        document.write("Numeros pares: <br>")
        for(var i = 0; i <= 10; i++){
            
            if(i % 2 == 0){
                document.write("# "+ i + "<br>");
            }

        }

    </script>

</head>

</body>
</html>

<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Ejemplo ternario</title>
    <link rel='stylesheet' href='main.css'>
    <script>
        var factura = 10000;
        var pago = 9000;
        var devuelta = factura - pago;
        devuelta = (devuelta > 0) ? true : false;
        
        var mensaje = devuelta ? "Te hace falta pagar" : "Muchas gracias vuelva pronto";

        document.write(mensaje);
    </script>
</head>
<body>
    
</body>
</html>
